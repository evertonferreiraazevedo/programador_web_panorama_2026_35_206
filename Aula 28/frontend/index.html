<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h2>Cadastrar Usuário</h2>
        <form id="formularioUsuario">
            <input type="text" id="campoNome" placeholder="Nome Completo" required>
            <input type="text" id="campoCargo" placeholder="Cargo ou Função" required>
            <button type="submit">Salvar no Sistema</button>
        </form>
    </div>
    <div class="box">
        <h2>Usuários Cadastrados</h2>
        <ul id="listaVisual"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
