<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Interna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Sistema</h1>
        <button id="btnSair">Sair</button>
    </header>
    <main class="conteudo">
        <section class="cabecalho-main">
            <h2>Bem-vindo!</h2>
            <p>
                Você está na página interna do sistema.
            </p>
        </section>
        <section>
            <div class="card">
                <h3>Área do usuário</h3>
                <p>
                    Aqui poderiam ficar as funcionalidades do sistema.
                </p>
            </div>
            <div class="card">
                <h3>Área de Feed</h3>
                <p>
                    Aqui poderiam ficar atualizações ou historico de atividade do sistema.
                </p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>

</body>

</html>
