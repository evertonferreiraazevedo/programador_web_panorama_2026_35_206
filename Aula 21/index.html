<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <h1>Visualizador de Loops em JavaScript (For e While)</h1>
    <p>Clique nos botões abaixo para ver os laços de repetição gerando conteúdo dinamicamente na página.</p>

    <section style="margin-bottom: 30px;">
        <h2>1. Exemplo com FOR (Contagem Regressiva)</h2>
        <button onclick="executarFor()">Rodar Loop FOR</button>
        <ul id="listaFor"></ul>
    </section>

    <hr>
    <section>
        <h2>2. Exemplo com WHILE (Colocando Roupas na Mala)</h2>
        <button onclick="executarWhile()">Rodar Loop WHILE</button>
        <ul id="listaWhile"></ul>
    </section>
    <script src="script.js"></script>
</body>

</html>
